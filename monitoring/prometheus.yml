global:
  scrape_interval: 15s # каждые 15 секунд забираем метрики

scrape_configs:
  # Собираем метрики с Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Собираем метрики с хоста через node-exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
