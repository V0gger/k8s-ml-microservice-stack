apiVersion: v1
kind: Service
metadata:
  name: ml-app-service
spec:
  # NodePort откроет порт на самой ВМ
  type: NodePort
  selector:
    app: ml-app # селектор связывает Service с нашим Deployment
  ports:
    - protocol: TCP
      port: 8000 # Порт внутри кластера
      targetPort: 8000 # Порт внутри контейнера
      nodePort: 30080 # Порт на каждой ноде
